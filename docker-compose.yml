name: local-model-template

services:
  local-ai:
    build:
      context: ./local-ai
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_URL: "http://model:8080"
    ports:
      - "127.0.0.1:${LOCAL_AI_PORT:-8080}:8080"
    networks: [inference]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  inference:
    internal: true
